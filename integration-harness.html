<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test intégration - Chute des mots</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #181c22;
        background: #f3f6fa;
      }

      main {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 18px;
      }

      iframe {
        width: 100%;
        height: 720px;
        border: 2px solid #a9b8c8;
        border-radius: 8px;
        background: #fff;
      }

      pre {
        min-height: 120px;
        overflow: auto;
        padding: 12px;
        background: #fff;
        border: 1px solid #d4dde8;
        border-radius: 8px;
      }

      button {
        min-height: 42px;
        margin: 0 0 12px;
        padding: 9px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Test d'intégration Chute des mots</h1>
      <button id="reloadHarness" type="button">Relancer le test iframe</button>
      <pre id="resultLog">En attente du message de fin...</pre>
      <iframe id="gameFrame" title="Chute des mots intégré"></iframe>
    </main>

    <script>
      const frame = document.getElementById("gameFrame");
      const resultLog = document.getElementById("resultLog");
      const reloadButton = document.getElementById("reloadHarness");

      function buildTestUrl() {
        const params = new URLSearchParams({
          contentMode: "tools",
          cefrLevel: "B1",
          playMode: "game",
          wordsPerGame: "1",
          missionId: "harness-outils-b1",
          integrationMode: "1",
          minScore: "0",
          minCorrect: "0",
          minAccuracy: "0",
          allowColumnDeath: "false",
          autostart: "1",
        });

        return `index.html?${params.toString()}`;
      }

      function reloadHarness() {
        resultLog.textContent = "En attente du message de fin...";
        frame.src = buildTestUrl();
      }

      window.addEventListener("message", (event) => {
        const contract = frame.contentWindow?.ChuteDesMots?.CONTRACT;
        const expectedType = contract?.completeMessageType ?? "chute-des-mots:complete";
        if (event.data?.type !== expectedType) return;
        resultLog.textContent = JSON.stringify(event.data.payload, null, 2);
      });

      reloadButton.addEventListener("click", reloadHarness);
      reloadHarness();
    </script>
  </body>
</html>
